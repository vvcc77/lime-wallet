name: CI
on:
  push:
  pull_request:
jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: nightly }
      - run: forge --version
      - run: forge build
      - run: forge test -vvv
  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crytic/slither-action@v0.3.4
        with:
          node-version: 20
          fail-on: medium
